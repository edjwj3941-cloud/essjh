name: LastSpark
version: 1.0.0
main: com.lastspark.LastSparkPlugin
api-version: '1.21'
description: 15 unique one-of-a-kind relics, forged by The Last Spark.
authors: [LastSpark]

commands:
  spark:
    description: Manage The Last Spark relics
    usage: /spark <list|give|reset|reload>
    permission: lastspark.admin
    aliases: [lastspark, relics]

permissions:
  lastspark.admin:
    description: Lets you give, list and reset relics
    default: op
