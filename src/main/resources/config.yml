# ===========================================================================
#  The Last Spark - config.yml
# ===========================================================================
#  Every relic below can be restyled. For each one you can change:
#    name              Display name. Supports & color codes.
#    material          Base item. Pick any item; it decides the vanilla look and base stats.
#    lore              Tooltip lines. Keep them in sync with what the ability really does.
#    enchantments      "name:level,name:level" using vanilla enchantment keys. Levels may exceed vanilla maximums.
#    item-model        Resource-pack model, e.g. "lastspark:eclipse_crown" (needs a pack that defines it). Leave "" for none.
#    custom-model-data Number for packs that use custom_model_data (0 = off).
#
#  Changes only affect relics forged AFTER a /spark reload. To restyle an existing relic:
#  /spark reset <relic>, then /spark give <relic>.
#  Do not rename the keys under "items:" - they are the relic ids.
# ===========================================================================

# How often (in ticks, 20 = 1s) the plugin sweeps online inventories, open containers and dropped
# items for duplicate or counterfeit relics.
scan-interval-ticks: 100

spark:
  radius: 6.0            # how close someone must be to be consumed
  target-players: true
  target-mobs: true
  prefer-players: true   # if both a player and a mob are close, take the player
  broadcast: true        # announce every consumption to the whole server

abilities:
  crown-dodge-chance: 0.30     # Eclipse Crown projectile dodge (0.0 - 1.0)
  lifebloom-heal: 10.0         # health restored by the Lifebloom Charm (2 = 1 heart)
  waystone-channel-seconds: 3  # stand-still time before the Waystone Shard teleports you

# Cooldowns in seconds
cooldowns:
  spark: 30
  waystone: 30
  lifebloom: 90
  hook: 3
  phoenix: 300
  voidstep: 10
  thunder_smash: 3
  maul_smash: 3
  maul_leap: 12
  axe_cleave: 10
  dagger_step: 12
  skyfall: 6

